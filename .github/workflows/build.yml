name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore contract tests
        run: dotnet restore tests/MR.SAASy.Contracts.Tests/MR.SAASy.Contracts.Tests.csproj

      - name: Test contracts
        run: dotnet test tests/MR.SAASy.Contracts.Tests/MR.SAASy.Contracts.Tests.csproj --configuration Release --no-restore

      - name: Restore core tests
        run: dotnet restore tests/MR.SAASy.Core.Tests/MR.SAASy.Core.Tests.csproj

      - name: Test core
        run: dotnet test tests/MR.SAASy.Core.Tests/MR.SAASy.Core.Tests.csproj --configuration Release --no-restore

      - name: Restore integration contract tests
        run: dotnet restore tests/MR.SAASy.Integration.Tests/MR.SAASy.Integration.Tests.csproj

      - name: Test integration contracts
        run: dotnet test tests/MR.SAASy.Integration.Tests/MR.SAASy.Integration.Tests.csproj --configuration Release --no-restore

      - uses: azure/setup-bicep@v2

      - name: Validate MOTOR Bicep compilation
        run: bicep build infrastructure/bicep/main.bicep --stdout > /dev/null

      - name: Pack contracts
        run: dotnet pack src/MR.SAASy.Contracts/MR.SAASy.Contracts.csproj --configuration Release --output artifacts

      - name: Upload contract package
        uses: actions/upload-artifact@v4
        with:
          name: mr-saasy-contracts
          path: artifacts/*.nupkg
